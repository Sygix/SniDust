name: Runtime tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Build test image
        run: docker build -t snidust:diagnostic .
      - name: Run container integration tests
        run: python3 tests/test_runtime.py
